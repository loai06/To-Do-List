name: todo_hive_app
description: "To-Do List & Settings app using SharedPreferences + Hive (manual TypeAdapter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Local key-value storage for the notification switch
  shared_preferences: ^2.2.3

  # Local NoSQL database for tasks (manual TypeAdapter, no code generation)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
